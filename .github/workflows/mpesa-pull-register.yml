name: Register M-Pesa Pull

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  register-pull:
    name: Set Pull nominated number and register with Safaricom
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Update .env and run register_mpesa_pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 5m
          debug: true
          script: |
            set -euxo pipefail
            git config --global --add safe.directory /srv/elearning
            APP_DIR=/srv/elearning
            ENV="$APP_DIR/.env"
            NOMINATED=254726550916

            cd "$APP_DIR"
            echo "==> Git HEAD before pull: $(git rev-parse --short HEAD 2>/dev/null || echo none)"
            git fetch origin
            git reset --hard origin/main
            echo "==> Git HEAD after pull: $(git rev-parse --short HEAD)"

            if [[ ! -f "$ENV" ]]; then
              echo "Missing $ENV"
              exit 1
            fi

            if grep -q '^MPESA_PULL_NOMINATED_NUMBER=' "$ENV"; then
              sed -i "s|^MPESA_PULL_NOMINATED_NUMBER=.*|MPESA_PULL_NOMINATED_NUMBER=${NOMINATED}|" "$ENV"
            else
              printf '\n# Daraja Pull Transactions\nMPESA_PULL_NOMINATED_NUMBER=%s\n' "$NOMINATED" >> "$ENV"
            fi
            chown elearning:www-data "$ENV"
            chmod 640 "$ENV"
            grep '^MPESA_PULL_NOMINATED_NUMBER=' "$ENV"

            if [[ ! -f "$APP_DIR/subscriptions/management/commands/register_mpesa_pull.py" ]]; then
              echo "ERROR: register_mpesa_pull missing after git pull"
              ls -la "$APP_DIR/subscriptions/management/commands/" || true
              exit 1
            fi

            sudo -u elearning "$APP_DIR/.venv/bin/python" manage.py register_mpesa_pull || {
              ec=$?
              echo "register_mpesa_pull failed with exit $ec"
              exit "$ec"
            }