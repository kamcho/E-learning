name: St Anthony check mail

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect book form + mail logs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          script_stop: false
          command_timeout: 8m
          script: |
            set -euo pipefail
            APP=/srv/stanthony
            cd "$APP"
            git fetch origin
            git reset --hard origin/main
            echo "==> HEAD $(git log -1 --oneline)"
            echo "==> book handlers"
            grep -n "book_appointment\|AppointmentRequestForm\|email.send\|Failed to send" home/views.py | head -n 30
            echo "==> Email env"
            grep -E '^EMAIL_|^CONTACT_|^DEFAULT_FROM' .env | sed -E 's/(PASSWORD=).*/\1***/'
            echo "==> Recent /book/ activity"
            journalctl -u stanthony-gunicorn --since "6 hours ago" --no-pager | grep -E "POST /book|Failed to send|SMTPAuthenticationError|appointment" | tail -n 50 || true
            bash deploy.sh
            sudo -u stanthony "$APP/.venv/bin/python" "$APP/deploy/send_test_appointment.py"
