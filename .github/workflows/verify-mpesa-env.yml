name: Verify production MPESA env

on:
  workflow_dispatch:

jobs:
  compare:
    name: Fingerprint production MPESA .env
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: SSH fingerprint /srv/elearning/.env
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            ENV=/srv/elearning/.env
            test -f "$ENV"
            cd /srv/elearning
            sudo -u elearning .venv/bin/python deploy/_mpesa_env_fingerprint.py "$ENV"