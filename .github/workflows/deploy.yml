name: Deploy to droplet

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual "Run workflow" from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to somasmartassesments.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            # Avoid "dubious ownership" when Actions SSHs as root into a
            # repo owned by elearning:www-data
            git config --global --add safe.directory /srv/elearning

            cd /srv/elearning

            if [[ ! -d .git ]]; then
              echo "ERROR: /srv/elearning is not a git repo."
              echo "Clone the GitHub repo there first (see DEPLOYMENT.md → GitHub Actions)."
              exit 1
            fi

            echo "==> Fetching origin/main"
            git fetch origin
            git reset --hard origin/main
            echo "    HEAD: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

            if [[ ! -f deploy/update.sh ]]; then
              echo "ERROR: deploy/update.sh missing after pull."
              echo "Confirm the file exists on the main branch of this GitHub repo."
              ls -la deploy || true
              exit 1
            fi

            chmod +x deploy/update.sh
            bash deploy/update.sh
