name: Deploy to droplet

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual "Run workflow" from GitHub UI

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to 159.223.143.29
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /srv/elearning

            if [[ ! -d .git ]]; then
              echo "ERROR: /srv/elearning is not a git repo."
              echo "Clone the GitHub repo there first (see DEPLOYMENT.md → GitHub Actions)."
              exit 1
            fi

            if [[ ! -x deploy/update.sh ]]; then
              chmod +x deploy/update.sh
            fi

            # Pull the new update.sh first so this run uses the latest script
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy/update.sh

            bash deploy/update.sh
