name: St Anthony create staff user

on:
  workflow_dispatch:
    inputs:
      username:
        description: Staff username
        required: true
        default: staff
      password:
        description: Staff password
        required: true
        default: staff123

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Django staff user
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAFF_USER: ${{ github.event.inputs.username }}
          STAFF_PASS: ${{ github.event.inputs.password }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          envs: STAFF_USER,STAFF_PASS
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/stanthony
            sudo -u stanthony env STAFF_USER="$STAFF_USER" STAFF_PASS="$STAFF_PASS" \
              /srv/stanthony/.venv/bin/python -c "
            import os, django
            os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
            django.setup()
            from django.contrib.auth import get_user_model
            User = get_user_model()
            username = os.environ['STAFF_USER']
            password = os.environ['STAFF_PASS']
            u, created = User.objects.get_or_create(username=username, defaults={'is_staff': True, 'is_superuser': True})
            u.set_password(password)
            u.is_staff = True
            u.is_superuser = True
            u.save()
            print(('created' if created else 'updated'), username)
            "
