name: St Anthony create staff user

on:
  workflow_dispatch:
    inputs:
      username:
        description: Staff username
        required: true
        default: staff
      password:
        description: Staff password
        required: true
        default: staff123

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create Django staff user
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /srv/stanthony
            sudo -u stanthony /srv/stanthony/.venv/bin/python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); u,_=U.objects.get_or_create(username='${{ github.event.inputs.username }}', defaults={'is_staff': True, 'is_superuser': True}); u.set_password('${{ github.event.inputs.password }}'); u.is_staff=True; u.is_superuser=True; u.save(); print(u.username)"
