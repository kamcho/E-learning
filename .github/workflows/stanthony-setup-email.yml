name: St Anthony setup email

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy form + configure Namecheap SMTP
        uses: appleboy/ssh-action@v1.2.0
        env:
          EMAIL_PASS: ${{ secrets.STANTHONY_EMAIL_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          envs: EMAIL_PASS
          script_stop: true
          command_timeout: 12m
          script: |
            set -euo pipefail
            APP=/srv/stanthony
            cd "$APP"
            git fetch origin
            git reset --hard origin/main
            chmod +x deploy.sh deploy/*.sh || true
            python3 "$APP/deploy/configure_email.py"
            chown stanthony:www-data "$APP/.env"
            chmod 640 "$APP/.env"
            bash deploy.sh
            echo "==> Email setup done"
