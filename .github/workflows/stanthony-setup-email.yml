name: St Anthony setup email

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'ssl (465) or tls (587)'
        required: true
        default: 'ssl'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SMTP and test
        uses: appleboy/ssh-action@v1.2.0
        env:
          EMAIL_PASS_B64: ${{ secrets.STANTHONY_EMAIL_PASSWORD_B64 }}
          EMAIL_MODE: ${{ github.event.inputs.mode }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          password: ${{ secrets.DROPLET_SSH_PASSWORD }}
          envs: EMAIL_PASS_B64,EMAIL_MODE
          script_stop: true
          command_timeout: 12m
          script: |
            set -euo pipefail
            APP=/srv/stanthony
            cd "$APP"
            git fetch origin
            git reset --hard origin/main
            python3 "$APP/deploy/configure_email.py"
            chown stanthony:www-data "$APP/.env"
            chmod 640 "$APP/.env"
            bash deploy.sh
            sudo -u stanthony "$APP/.venv/bin/python" "$APP/deploy/test_smtp.py"
            echo "==> Email setup done"
