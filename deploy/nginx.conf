# nginx site for Elearning
# Install to: /etc/nginx/sites-available/elearning  (then symlink into sites-enabled)
# Domain: somasmartassesments.com  |  Servers: 185.170.196.219, 159.223.143.29

upstream elearning_app {
    server unix:/run/elearning/elearning.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name somasmartassesments.com www.somasmartassesments.com 185.170.196.219 159.223.143.29;

    client_max_body_size 25M;

    # Static files collected by `collectstatic`
    location /static/ {
        alias /srv/elearning/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media
    location /media/ {
        alias /srv/elearning/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://elearning_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # AI requests can take a while
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# After running Certbot, it will add a matching `listen 443 ssl` server block
# automatically and redirect port 80 -> 443.
