<fieldset class="exam-strict-choice">
  <legend class="exam-strict-choice__legend">Exam monitoring</legend>
  <p class="exam-strict-choice__intro">Choose before you start. In <strong>strict mode</strong> you must stay on this tab.</p>
  <div class="exam-strict-choice__options">
    <label class="exam-strict-choice__option">
      <input type="radio" name="exam_strict_mode" value="0" checked>
      <span class="exam-strict-choice__label">Standard</span>
      <span class="exam-strict-choice__hint">No tab limits.</span>
    </label>
    <label class="exam-strict-choice__option">
      <input type="radio" name="exam_strict_mode" value="1">
      <span class="exam-strict-choice__label">Strict mode</span>
      <span class="exam-strict-choice__hint">Max 3 tab switches; each switch under 10 seconds. Otherwise the exam resets.</span>
    </label>
  </div>
</fieldset>
