<style>
  .exams-wizard-shell {
    max-width: 1180px;
    margin: 0 auto;
  }

  .ew-learner-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
    flex-wrap: wrap;
    margin-bottom: var(--space-lg);
    padding: 0.85rem 1.1rem;
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: 16px;
  }

  .ew-learner-info {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-width: 0;
  }

  .ew-learner-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b1538 0%, #3dd6c6 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 800;
    flex-shrink: 0;
  }

  .ew-learner-name {
    font-family: var(--font-heading);
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--clr-text);
  }

  .ew-learner-meta {
    font-size: 0.78rem;
    color: var(--clr-text-muted);
  }

  .ew-learner-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .ew-action-btn {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--clr-text-muted);
    background: var(--clr-surface-alt);
    border: 1px solid var(--clr-border);
    border-radius: 10px;
    padding: 0.42rem 0.85rem;
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .ew-action-btn:hover {
    color: var(--clr-primary);
    border-color: rgba(61, 214, 198, 0.35);
    background: rgba(61, 214, 198, 0.06);
  }

  .ew-progress-card {
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: 16px;
    padding: 1rem 1.15rem 1.1rem;
    margin-bottom: var(--space-lg);
  }

  .ew-progress-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .ew-progress-title {
    font-family: var(--font-heading);
    font-size: 0.92rem;
    font-weight: 800;
    color: var(--clr-text);
  }

  .ew-progress-count {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--clr-text-muted);
  }

  .ew-progress-track {
    height: 8px;
    background: var(--clr-surface-alt);
    border-radius: 999px;
    overflow: hidden;
  }

  .ew-progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #c41e3a 0%, #3dd6c6 100%);
    transition: width 0.35s ease;
  }

  .ew-steps {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .ew-step {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr);
    gap: 0.85rem;
    position: relative;
  }

  .ew-step:not(:last-child) .ew-step-rail::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 42px;
    bottom: -0.65rem;
    width: 2px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, rgba(61, 214, 198, 0.45), rgba(61, 214, 198, 0.08));
  }

  .ew-step-rail {
    position: relative;
    display: flex;
    justify-content: center;
    padding-top: 0.35rem;
  }

  .ew-step-marker {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.82rem;
    font-weight: 800;
    z-index: 1;
    flex-shrink: 0;
  }

  .ew-step--complete .ew-step-marker {
    background: rgba(61, 214, 198, 0.15);
    color: #3dd6c6;
    border: 2px solid rgba(61, 214, 198, 0.35);
  }

  .ew-step--current .ew-step-marker {
    background: linear-gradient(135deg, #c41e3a, #3dd6c6);
    color: #0a0f14;
    box-shadow: 0 0 0 4px rgba(61, 214, 198, 0.15);
  }

  .ew-step-card {
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: 16px;
    padding: 0.85rem 1rem;
    margin-bottom: 0.85rem;
  }

  .ew-step--complete .ew-step-card {
    background: var(--clr-surface-alt);
    border-color: rgba(61, 214, 198, 0.12);
  }

  .ew-step--current .ew-step-card {
    border-color: rgba(61, 214, 198, 0.28);
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
    padding: 1rem 1.1rem 1.15rem;
    margin-bottom: var(--space-xl);
  }

  .ew-step-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    margin-bottom: 0.35rem;
  }

  .ew-step-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--clr-text-muted);
  }

  .ew-step-change {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--clr-primary);
    text-decoration: none;
  }

  .ew-step-change:hover { text-decoration: underline; }

  .ew-step-value {
    font-family: var(--font-heading);
    font-size: 1rem;
    font-weight: 800;
    color: var(--clr-text);
    line-height: 1.35;
  }

  .ew-step-active-head {
    display: flex;
    align-items: flex-start;
    gap: 0.85rem;
    margin-bottom: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--clr-border);
  }

  .ew-step-active-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: rgba(61, 214, 198, 0.12);
    color: #3dd6c6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  .ew-step-active-title {
    font-family: var(--font-heading);
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--clr-text);
    margin: 0 0 0.25rem;
  }

  .ew-step-active-hint {
    font-size: 0.84rem;
    color: var(--clr-text-muted);
    line-height: 1.45;
    margin: 0;
  }

  .ew-step-body .subject-browser,
  .ew-step-body .test-type-browser {
    margin-bottom: 0;
  }

  .ew-step-body .subject-browser-header,
  .ew-step-body .test-type-browser .subject-browser-header {
    display: none;
  }

  .ew-choice-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-md);
  }

  .subject-browser-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-md);
  }

  @media (max-width: 900px) {
    .ew-choice-grid,
    .subject-browser-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 640px) {
    .ew-choice-grid,
    .subject-browser-grid { grid-template-columns: 1fr; }
  }

  .ew-choice-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.4rem;
    padding: 1.15rem 1rem;
    border: 2px solid var(--clr-border);
    border-radius: 16px;
    background: var(--clr-surface-alt);
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }

  .ew-choice-card:hover {
    border-color: rgba(61, 214, 198, 0.45);
    background: rgba(61, 214, 198, 0.06);
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  }

  .ew-choice-card--0 { --card-accent: #3dd6c6; --card-soft: rgba(61, 214, 198, 0.12); }
  .ew-choice-card--1 { --card-accent: #c41e3a; --card-soft: rgba(196, 30, 58, 0.12); }
  .ew-choice-card--2 { --card-accent: #f4a261; --card-soft: rgba(244, 162, 97, 0.12); }

  .ew-choice-icon-wrap {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--card-soft, rgba(61, 214, 198, 0.12));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 0.15rem;
  }

  .ew-choice-name {
    font-weight: 800;
    font-size: 0.92rem;
    color: var(--clr-text);
  }

  .ew-choice-desc {
    font-size: 0.76rem;
    color: var(--clr-text-muted);
    line-height: 1.4;
  }

  .ew-choice-meta {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--card-accent, var(--clr-primary));
    margin-top: 0.15rem;
  }
</style>
