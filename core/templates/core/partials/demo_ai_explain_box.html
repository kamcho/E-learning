{# AI tutor explanation — auto_load: fetch immediately (wrong); else show button (correct). #}
<div
  class="demo-ai-box{% if not auto_load %} demo-ai-trigger{% endif %}"
  id="demo-ai-box"
  tabindex="-1"
  aria-label="AI tutor explanation"
  data-question-uuid="{% if question_uuid %}{{ question_uuid }}{% elif question.uuid %}{{ question.uuid }}{% endif %}"
  data-ai-auto-load="{% if auto_load %}1{% else %}0{% endif %}"
  data-speech-region
  data-speech-wait-complete="1"
  {% if question.explanation_audio %}data-speech-audio-url="{{ question.explanation_audio.url }}"{% endif %}
>
  {% if not auto_load %}
  <p class="demo-ai-invite">Got it right? Ask the tutor why this answer works — even if you guessed.</p>
  <button type="button" class="demo-btn demo-btn-outline demo-ai-btn" id="demo-ai-start-btn">Explain with AI tutor</button>
  {% endif %}

  <div class="demo-ai-loading" id="demo-ai-loading" role="status" aria-live="polite"{% if not auto_load %} hidden{% endif %}>
    <span class="demo-ai-spinner" aria-hidden="true"></span>
    <span class="demo-ai-loading-copy">
      <span class="demo-ai-loading-title">
        AI tutor is thinking
        <span class="demo-ai-dots" aria-hidden="true"><span></span><span></span><span></span></span>
      </span>
      <span class="demo-ai-loading-sub">Preparing a short explanation for this answer</span>
    </span>
  </div>
  <div class="demo-ai-text" id="demo-ai-text" data-speech-text data-math-content hidden></div>
  <div class="demo-ai-text demo-ai-error" id="demo-ai-error" hidden style="color:#f87171;"></div>
  <div class="explanation-speech-controls">
    <button type="button" class="demo-btn demo-btn-outline" data-speech-speak hidden
      data-default-label="Listen with AI" data-label-loading="Loading…"
      data-label-stop="Stop speaking"
      data-label-recorded="Play recording">Listen with AI</button>
  </div>
  <button type="button" class="demo-btn demo-btn-outline demo-ai-retry" id="demo-ai-retry" hidden style="margin-top:0.75rem;">Try again</button>
</div>
