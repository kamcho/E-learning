{% if exams_wizard.steps %}
<nav class="ew-trail" aria-label="Selections so far">
  {% for step in exams_wizard.steps %}
    {% if step.state == 'complete' and step.value %}
      {% if not forloop.first %}<span class="ew-trail-sep" aria-hidden="true"></span>{% endif %}
      <a href="{{ step.edit_url|default:'#' }}" class="ew-trail-chip">
        <span class="ew-trail-chip-label">{{ step.label }}</span>
        <span class="ew-trail-chip-value">{{ step.value }}</span>
      </a>
    {% endif %}
  {% endfor %}
</nav>
{% endif %}
