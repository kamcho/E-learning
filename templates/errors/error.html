<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} — {{ title }} · Soma Smart</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
      --green: #0d8a4e;
      --green-dark: #065f36;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --card: #111827;
        --text: #eef2ff;
        --muted: #9aa3b8;
        --border: rgba(255, 255, 255, 0.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at top, rgba(13, 138, 78, 0.16), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
    }
    .card {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12);
      padding: 2rem 1.75rem 1.6rem;
      text-align: center;
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 1rem;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0d8a4e, #065f36);
      color: #fff;
      font-weight: 800;
      font-size: 1.35rem;
    }
    .code {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
    }
    h1 {
      margin: 0.35rem 0 0.6rem;
      font-size: 1.55rem;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .hint { margin-top: 0.45rem; font-size: 0.85rem; }
    .actions {
      display: flex;
      gap: 0.65rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.4rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .primary {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #fff;
    }
    .secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: transparent;
    }
    .diagnostics {
      margin-top: 1.4rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      text-align: left;
    }
    .diagnostics summary {
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .diagnostics p {
      margin: 0.75rem 0;
      font-size: 0.8rem;
    }
    .diagnostics textarea {
      display: block;
      width: 100%;
      min-height: 12rem;
      resize: vertical;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: 0.78rem/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .diagnostics button {
      margin-top: 0.65rem;
      padding: 0.65rem 0.9rem;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .copy-status {
      display: inline-block;
      margin-left: 0.5rem;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">S</div>
    <p class="code">Error {{ code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p class="hint">{{ hint }}</p>
    <div class="actions">
      <a class="primary" href="/">Back home</a>
      <a class="secondary" href="/accounts/signin/">Sign in</a>
    </div>
    {% if diagnostic_report %}
    <details class="diagnostics">
      <summary>Administrator diagnostics</summary>
      <p>This traceback may contain sensitive information. Review it before sharing.</p>
      <textarea id="diagnostic-report" readonly spellcheck="false">{{ diagnostic_report }}</textarea>
      <button type="button" id="copy-diagnostic-report">Copy traceback</button>
      <span class="copy-status" id="copy-diagnostic-status" role="status" aria-live="polite"></span>
    </details>
    <script>
      (function () {
        var button = document.getElementById('copy-diagnostic-report');
        var report = document.getElementById('diagnostic-report');
        var status = document.getElementById('copy-diagnostic-status');

        button.addEventListener('click', function () {
          function copied() {
            status.textContent = 'Traceback copied.';
          }

          function selectAndCopy() {
            report.focus();
            report.select();
            if (document.execCommand('copy')) {
              copied();
            } else {
              status.textContent = 'Copy failed. Select and copy the text above.';
            }
          }

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(report.value).then(copied, selectAndCopy);
          } else {
            selectAndCopy();
          }
        });
      })();
    </script>
    {% endif %}
  </main>
</body>
</html>
