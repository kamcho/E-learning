<div class="stk-pay-reconcile" id="stk-pay-reconcile">
  <p class="stk-pay-reconcile-title">Already paid but this page didn’t update?</p>
  <p class="stk-pay-reconcile-lead">
    Paste your <strong>M-Pesa confirmation code</strong> or SMS. We verify it with Safaricom
    <strong>Pull Transactions</strong> (pay bill records for the last 48 hours).
  </p>
  <form class="stk-pay-reconcile-form" id="stk-pay-reconcile-form" method="post" action="{{ reconcile_url }}">
    {% csrf_token %}
    <label class="stk-pay-reconcile-label" for="stk-mpesa-message">Confirmation code or SMS</label>
    <textarea
      id="stk-mpesa-message"
      name="mpesa_message"
      class="stk-pay-reconcile-input"
      rows="4"
      required
      placeholder="TH78X9K2L1&#10;— or paste the full M-Pesa SMS"
      autocomplete="off"
      spellcheck="false"
    ></textarea>
    <p class="stk-pay-reconcile-error" id="stk-pay-reconcile-error" role="alert" hidden></p>
    <button type="button" class="btn btn-primary stk-pay-reconcile-submit" id="stk-pay-reconcile-submit">
      Confirm payment
    </button>
  </form>
</div>
