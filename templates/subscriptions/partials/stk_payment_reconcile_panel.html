<div class="stk-pay-reconcile" id="stk-pay-reconcile">
  <p class="stk-pay-reconcile-title">Already paid but this page didn’t update?</p>
  <p class="stk-pay-reconcile-lead">
    Paste the <strong>full M-Pesa confirmation SMS</strong> (including the receipt code and Ksh amount).
    We’ll match it to this payment and complete your order.
  </p>
  <form class="stk-pay-reconcile-form" id="stk-pay-reconcile-form" method="post" action="{{ reconcile_url }}">
    {% csrf_token %}
    <label class="stk-pay-reconcile-label" for="stk-mpesa-message">M-Pesa message</label>
    <textarea
      id="stk-mpesa-message"
      name="mpesa_message"
      class="stk-pay-reconcile-input"
      rows="5"
      required
      placeholder="Example: ABC12DEF34 Confirmed. Ksh15.00 paid to …"
    ></textarea>
    <p class="stk-pay-reconcile-error" id="stk-pay-reconcile-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary stk-pay-reconcile-submit" id="stk-pay-reconcile-submit">
      Confirm payment
    </button>
  </form>
</div>
