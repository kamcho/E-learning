<script>
(function () {
  var root = document.getElementById('stk-pay-root');
  if (!root) return;

  var statusUrl = root.getAttribute('data-status-url');
  var reconcileUrl = root.getAttribute('data-reconcile-url') || '';
  var redirectFallback = root.getAttribute('data-redirect-fallback') || '';
  var pollMs = parseInt(root.getAttribute('data-poll-ms') || '3000', 10);
  var maxPolls = parseInt(root.getAttribute('data-max-polls') || '60', 10);

  var card = document.getElementById('stk-pay-card');
  var titleEl = document.getElementById('stk-pay-title');
  var leadEl = document.getElementById('stk-pay-lead');
  var statusBox = document.getElementById('stk-pay-status');
  var statusLabel = document.getElementById('stk-pay-status-label');
  var statusDetail = document.getElementById('stk-pay-status-detail');
  var receiptEl = document.getElementById('stk-pay-receipt');
  var reconcilePanel = document.getElementById('stk-pay-reconcile');
  var reconcileForm = document.getElementById('stk-pay-reconcile-form');
  var reconcileError = document.getElementById('stk-pay-reconcile-error');
  var reconcileSubmit = document.getElementById('stk-pay-reconcile-submit');

  var waitingTitle = titleEl ? titleEl.textContent.trim() : 'Check your phone';
  var waitingLeadHtml = leadEl ? leadEl.innerHTML : '';

  var polls = 0;
  var finished = false;

  var copy = {
    waiting: {
      label: 'Waiting for M-Pesa',
      detail: 'Confirm the STK prompt on your phone. We will update this page automatically.',
    },
    success: {
      label: 'Payment successful',
      detail: 'Thank you! Your payment was received.',
    },
    failed: {
      label: 'Payment failed',
      detail: 'The payment did not go through.',
    },
    cancelled: {
      label: 'Payment cancelled',
      detail: 'The STK request was cancelled on your phone.',
    },
    timeout: {
      label: 'Still waiting',
      detail: 'We have not received confirmation yet.',
    },
    error: {
      label: 'Connection issue',
      detail: 'Could not reach the server. We will keep trying…',
    },
  };

  function normalizeMpesaText(text) {
    return (text || '').replace(/\s+/g, ' ').trim();
  }

  function explainMpesaResponse(state, resultDescription) {
    var callbackText = normalizeMpesaText(resultDescription);
    var lower = callbackText.toLowerCase();

    if (state === 'cancelled') {
      return {
        title: callbackText || copy.cancelled.detail,
        explanation:
          'M-Pesa says the STK prompt was cancelled (for example you pressed Cancel or did not enter your PIN in time). ' +
          'No charge should be made for this attempt. Start a new payment, or paste your confirmation SMS below if money was still deducted.',
        statusLabel: copy.cancelled.label,
        statusDetail: callbackText || copy.cancelled.detail,
      };
    }

    if (state === 'failed') {
      var failExplain =
        'M-Pesa could not complete this payment. Check your balance and network, then try again.';
      if (/insufficient/i.test(lower)) {
        failExplain = 'M-Pesa reports insufficient funds. Top up your M-Pesa balance and try again.';
      } else if (/invalid/i.test(lower)) {
        failExplain = 'M-Pesa rejected the request. Confirm the phone number and amount, then try again.';
      } else if (callbackText) {
        failExplain =
          'M-Pesa returned: “' + callbackText + '”. If your account was charged anyway, paste the confirmation SMS below.';
      }
      return {
        title: callbackText || 'Payment failed',
        explanation: failExplain,
        statusLabel: copy.failed.label,
        statusDetail: callbackText || copy.failed.detail,
      };
    }

    if (state === 'success') {
      return {
        title: 'Payment successful',
        explanation:
          callbackText ||
          'Your payment was confirmed. We are redirecting you now.',
        statusLabel: copy.success.label,
        statusDetail: callbackText || copy.success.detail,
      };
    }

    if (state === 'timeout') {
      return {
        title: 'No confirmation yet',
        explanation:
          'M-Pesa has not confirmed this payment on our side. If you entered your PIN, wait a moment or paste the full confirmation SMS below.',
        statusLabel: copy.timeout.label,
        statusDetail: copy.timeout.detail,
      };
    }

    if (state === 'error') {
      return {
        title: 'Checking payment status',
        explanation: copy.error.detail,
        statusLabel: copy.error.label,
        statusDetail: copy.error.detail,
      };
    }

    return {
      title: waitingTitle,
      explanation: '',
      statusLabel: copy.waiting.label,
      statusDetail: copy.waiting.detail,
    };
  }

  function applyHeadline(state, resultDescription) {
    if (state === 'waiting') {
      if (titleEl) titleEl.textContent = waitingTitle;
      if (leadEl) leadEl.innerHTML = waitingLeadHtml;
      return;
    }
    var brief = explainMpesaResponse(state, resultDescription);
    if (titleEl) titleEl.textContent = brief.title;
    if (leadEl) leadEl.textContent = brief.explanation;
    if (statusLabel) statusLabel.textContent = brief.statusLabel;
    if (statusDetail) statusDetail.textContent = brief.statusDetail;
  }

  function showReconcilePanel() {
    if (reconcilePanel) reconcilePanel.hidden = false;
  }

  function setState(state, resultDescription) {
    if (!card || !statusBox) return;
    card.className = 'stk-pay-card is-' + state;
    statusBox.className = 'stk-pay-status is-' + state;
    if (state === 'waiting') {
      applyHeadline('waiting');
      if (statusLabel) statusLabel.textContent = copy.waiting.label;
      if (statusDetail) statusDetail.textContent = copy.waiting.detail;
    } else {
      applyHeadline(state, resultDescription);
    }
    if (state !== 'success' && state !== 'waiting') {
      showReconcilePanel();
    }
  }

  function finishSuccess(data) {
    if (finished) return;
    finished = true;
    setState('success', data.result_description);
    if (data.mpesa_receipt_number && receiptEl) {
      receiptEl.textContent = 'M-Pesa receipt: ' + data.mpesa_receipt_number;
      receiptEl.hidden = false;
    }
    setTimeout(function () {
      window.location.href = data.redirect_url || redirectFallback;
    }, 1600);
  }

  function finishTerminal(state, resultDescription) {
    if (finished) return;
    finished = true;
    setState(state, resultDescription);
    showReconcilePanel();
  }

  function getCsrfToken() {
    var input = reconcileForm && reconcileForm.querySelector('input[name=csrfmiddlewaretoken]');
    return input ? input.value : '';
  }

  function bindReconcileForm() {
    if (!reconcileForm || !reconcileUrl) return;
    showReconcilePanel();
    reconcileForm.addEventListener('submit', function (event) {
      event.preventDefault();
      if (finished) return;
      var messageField = document.getElementById('stk-mpesa-message');
      var message = messageField ? messageField.value.trim() : '';
      if (!message) return;

      if (reconcileError) reconcileError.hidden = true;
      if (reconcileSubmit) reconcileSubmit.disabled = true;
      if (reconcilePanel) reconcilePanel.classList.add('is-submitting');

      var body = new FormData();
      body.append('mpesa_message', message);
      body.append('csrfmiddlewaretoken', getCsrfToken());

      fetch(reconcileUrl, {
        method: 'POST',
        body: body,
        credentials: 'same-origin',
        headers: { Accept: 'application/json' },
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (result) {
          if (result.ok && result.data.ok) {
            finishSuccess(result.data);
            return;
          }
          var msg = (result.data && result.data.error) || 'Could not confirm that payment.';
          if (reconcileError) {
            reconcileError.textContent = msg;
            reconcileError.hidden = false;
          }
        })
        .catch(function () {
          if (reconcileError) {
            reconcileError.textContent = 'Could not reach the server. Please try again.';
            reconcileError.hidden = false;
          }
        })
        .finally(function () {
          if (reconcileSubmit) reconcileSubmit.disabled = false;
          if (reconcilePanel) reconcilePanel.classList.remove('is-submitting');
        });
    });
  }

  function poll() {
    if (finished) return;
    polls += 1;
    fetch(statusUrl, { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (res) {
        if (!res.ok) throw new Error('bad status');
        return res.json();
      })
      .then(function (data) {
        if (data.status === 'success') {
          finishSuccess(data);
          return;
        }
        if (data.status === 'failed') {
          finishTerminal('failed', data.result_description);
          return;
        }
        if (data.status === 'cancelled') {
          finishTerminal('cancelled', data.result_description);
          return;
        }
        setState('waiting');
        if (polls < maxPolls) {
          setTimeout(poll, pollMs);
        } else {
          finishTerminal('timeout', '');
        }
      })
      .catch(function () {
        if (finished) return;
        if (polls < maxPolls) {
          setState('error');
          setTimeout(poll, Math.max(pollMs, 4000));
        } else {
          finishTerminal('timeout', '');
        }
      });
  }

  setState('waiting');
  bindReconcileForm();
  setTimeout(poll, 1800);
})();
</script>
