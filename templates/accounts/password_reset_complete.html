{% extends "base.html" %}

{% block title %}PIN updated — SomaKenya{% endblock %}

{% block content %}
<style>
  .auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: var(--space-xl) 0;
  }
  .auth-card {
    width: 100%;
    max-width: 450px;
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: var(--radius-xl);
    padding: var(--space-3xl) var(--space-2xl);
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .auth-title {
    font-family: var(--font-heading);
    font-size: 1.75rem;
    font-weight: 800;
    margin-bottom: var(--space-md);
  }
  .auth-subtitle {
    color: var(--clr-text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
  }
</style>

<div class="auth-wrapper">
  <div class="auth-card">
    <div style="font-size: 2.5rem; margin-bottom: var(--space-md);">&#9989;</div>
    <h1 class="auth-title">PIN updated</h1>
    <p class="auth-subtitle">
      Your PIN has been set successfully. You can now sign in with your phone number and new PIN.
    </p>
    <a href="{% url 'accounts:signin' %}" class="btn btn-primary" style="margin-top: var(--space-xl); width: 100%; justify-content: center;">
      Sign in
    </a>
  </div>
</div>
{% endblock %}
