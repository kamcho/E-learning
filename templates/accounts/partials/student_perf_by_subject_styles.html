<style>
  .card--performance {
    margin-bottom: var(--space-2xl);
  }

  /* —— Subject performance cards (reference dashboard layout) —— */
  .subject-perf-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
    gap: 1.1rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .subject-perf-card {
    background: var(--clr-surface);
    border: 1px solid var(--clr-border);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    padding: 1.1rem 1.15rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .subject-perf-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
  }

  .subject-perf-card-title-wrap {
    display: flex;
    align-items: flex-start;
    gap: 0.55rem;
    min-width: 0;
  }

  .subject-perf-card-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 8px;
    background: color-mix(in srgb, var(--clr-primary) 12%, #fff);
    color: var(--clr-primary);
    flex-shrink: 0;
  }

  .subject-perf-card-title {
    margin: 0;
    font-family: var(--font-heading);
    font-size: 1rem;
    font-weight: 800;
    color: var(--clr-text);
    line-height: 1.25;
  }

  .subject-perf-card-sub {
    margin: 0.2rem 0 0;
    font-size: 0.75rem;
    color: var(--clr-text-muted);
  }

  .subject-perf-card-link {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--clr-primary);
    text-decoration: none;
    white-space: nowrap;
    padding: 0.28rem 0.55rem;
    border-radius: 6px;
    border: 1px solid var(--clr-border);
    background: var(--clr-surface-alt);
  }

  .subject-perf-card-link:hover {
    background: color-mix(in srgb, var(--clr-primary) 8%, var(--clr-surface-alt));
  }

  .subject-perf-card-body {
    display: grid;
    grid-template-columns: 8.5rem 1fr;
    gap: 0.85rem 1.1rem;
    align-items: center;
  }

  @media (max-width: 480px) {
    .subject-perf-card-body {
      grid-template-columns: 1fr;
    }

    .subject-perf-gauge {
      margin: 0 auto;
    }
  }

  .subject-perf-gauge {
    position: relative;
    width: 100%;
    max-width: 9rem;
    margin: 0 auto;
  }

  .subject-perf-gauge-svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .subject-perf-gauge-track {
    stroke: var(--clr-surface-alt);
  }

  .subject-perf-gauge-fill {
    stroke: #3b82f6;
    transition: stroke-dashoffset 0.4s ease;
  }

  .subject-perf-gauge-fill--high { stroke: #16a34a; }
  .subject-perf-gauge-fill--mid { stroke: #ca8a04; }
  .subject-perf-gauge-fill--low { stroke: #e11d48; }

  .subject-perf-gauge-label {
    position: absolute;
    left: 50%;
    bottom: 0.15rem;
    transform: translateX(-50%);
    text-align: center;
    line-height: 1.15;
  }

  .subject-perf-gauge-label strong {
    display: block;
    font-family: var(--font-heading);
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--clr-text);
  }

  .subject-perf-gauge-label span {
    font-size: 0.72rem;
    color: var(--clr-text-muted);
    font-weight: 600;
  }

  .subject-perf-strands {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    min-width: 0;
  }

  .subject-perf-strand-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }

  .subject-perf-strand-name {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--clr-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .subject-perf-strand-pct {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--clr-text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .subject-perf-strand-track {
    height: 5px;
    border-radius: 4px;
    background: var(--clr-surface-alt);
    overflow: hidden;
  }

  .subject-perf-strand-fill {
    display: block;
    height: 100%;
    border-radius: 4px;
    min-width: 0;
  }

  .subject-perf-strand-empty,
  .subject-perf-more-strands {
    margin: 0;
    font-size: 0.72rem;
    color: var(--clr-text-muted);
  }
</style>
