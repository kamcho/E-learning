<script>
(function () {
  var chartDataEl = document.getElementById('{{ chart_data_id }}');
  if (!chartDataEl || typeof Chart === 'undefined') return;

  var chartData = JSON.parse(chartDataEl.textContent);
  var ctx = document.getElementById('{{ chart_canvas_id }}');
  if (!ctx) return;

  var wrap = ctx.closest('.chart-canvas-wrap');
  var mobileQuery = window.matchMedia('(max-width: 768px)');
  var chartInstance = null;

  var isDark = document.body.classList.contains('guardian-dash-dark');
  var theme = isDark ? {
    avg: '#3dd6c6',
    avgFill: 'rgba(61, 214, 198, 0.2)',
    best: '#c41e3a',
    bestFill: 'rgba(196, 30, 58, 0.1)',
    pointBorder: '#161f2a',
    tooltipBg: '#161f2a',
    tooltipTitle: '#e8edf2',
    tooltipBody: '#8b9aab',
    tooltipBorder: 'rgba(255,255,255,0.08)',
    grid: 'rgba(255,255,255,0.06)',
    tick: '#8b9aab',
  } : {
    avg: '#0D8A4E',
    avgFill: 'rgba(13, 138, 78, 0.2)',
    best: '#D4A017',
    bestFill: 'rgba(212, 160, 23, 0.08)',
    pointBorder: '#fff',
    tooltipBg: '#fff',
    tooltipTitle: '#1A1D26',
    tooltipBody: '#5A6178',
    tooltipBorder: '#E2E8F0',
    grid: 'rgba(0,0,0,0.04)',
    tick: '#8892A8',
  };

  function isMobileLayout() {
    return mobileQuery.matches;
  }

  function updateChartHeight(mobile) {
    if (!wrap) return;
    var count = chartData.labels.length;
    if (mobile) {
      wrap.style.height = Math.max(280, count * 44 + 72) + 'px';
    } else {
      wrap.style.height = '300px';
    }
  }

  function buildScales(mobile) {
    if (mobile) {
      return {
        x: {
          min: 0,
          max: 100,
          title: {
            display: true,
            text: 'Score',
            color: theme.tick,
            font: { size: 12, weight: '600' },
          },
          grid: { color: theme.grid, borderDash: [4, 4], drawBorder: false },
          ticks: {
            color: theme.tick,
            font: { size: 11 },
            stepSize: 20,
            callback: function (v) { return v < 10 ? '0' + v : v; },
          },
        },
        y: {
          grid: { display: false, drawBorder: false },
          ticks: {
            color: theme.tick,
            font: { size: 11 },
            autoSkip: false,
          },
        },
      };
    }

    return {
      x: {
        grid: { display: false, drawBorder: false },
        ticks: {
          color: '#8892A8',
          font: { size: 11 },
          maxRotation: 45,
          minRotation: 0,
        },
      },
      y: {
        min: 0,
        max: 100,
        title: {
          display: true,
          text: 'Avg Score',
          color: '#8892A8',
          font: { size: 12, weight: '600' },
        },
        grid: { color: 'rgba(0,0,0,0.04)', borderDash: [4, 4], drawBorder: false },
        ticks: {
          color: '#8892A8',
          font: { size: 12 },
          stepSize: 20,
          callback: function (v) { return v < 10 ? '0' + v : v; },
        },
      },
    };
  }

  function renderChart() {
    var mobile = isMobileLayout();
    updateChartHeight(mobile);

    if (chartInstance) {
      chartInstance.destroy();
      chartInstance = null;
    }

    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: chartData.labels,
        datasets: [
          {
            label: 'Avg Score',
            data: chartData.avg_scores,
            backgroundColor: theme.avgFill,
            borderColor: theme.avg,
            borderWidth: 2,
            borderRadius: 6,
            order: 2,
          },
          {
            label: 'Best Score',
            data: chartData.best_scores,
            type: 'line',
            borderColor: theme.best,
            backgroundColor: theme.bestFill,
            fill: false,
            tension: 0.35,
            pointRadius: 4,
            pointHoverRadius: 7,
            pointBackgroundColor: theme.best,
            pointBorderColor: theme.pointBorder,
            pointBorderWidth: 2,
            borderWidth: 2,
            order: 1,
          },
        ],
      },
      options: {
        indexAxis: mobile ? 'y' : 'x',
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: theme.tooltipBg,
            titleColor: theme.tooltipTitle,
            bodyColor: theme.tooltipBody,
            borderColor: theme.tooltipBorder,
            borderWidth: 1,
            padding: 12,
            boxPadding: 6,
            usePointStyle: true,
            callbacks: {
              afterBody: function (items) {
                var idx = items[0].dataIndex;
                var count = chartData.counts[idx];
                return count ? count + ' attempt' + (count !== 1 ? 's' : '') : 'No attempts';
              },
            },
          },
        },
        scales: buildScales(mobile),
      },
    });
  }

  renderChart();

  if (typeof mobileQuery.addEventListener === 'function') {
    mobileQuery.addEventListener('change', renderChart);
  } else if (typeof mobileQuery.addListener === 'function') {
    mobileQuery.addListener(renderChart);
  }
})();
</script>
